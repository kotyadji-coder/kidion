<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Киди</title>
<link rel="icon" href="/static/spark/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/spark/chat.css">
<link rel="stylesheet" href="/static/spark/landing.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px; }
  .auth-h { margin: 0 0 6px; font-size: 24px; font-weight: 600; letter-spacing: -0.025em; text-align: center; }
  .auth-sub { margin: 0 0 28px; font-size: 14px; color: var(--text-2); text-align: center; }
  .auth-field { margin-bottom: 14px; }
  .auth-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  .auth-input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; background: var(--surface-2); color: var(--text); outline: none; }
  .auth-input:focus { border-color: var(--spark-violet-border); box-shadow: 0 0 0 3px var(--spark-violet-soft); }
  .auth-btn { width: 100%; margin-top: 8px; }
  .auth-pw-wrap { position: relative; }
  .auth-pw-wrap .auth-input { padding-right: 44px; }
  .auth-pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-3); padding: 6px; line-height: 1; }
  .auth-pw-toggle:hover { color: var(--text-2); }
  .auth-forgot { text-align: right; margin-top: 4px; }
  .auth-forgot a { font-size: 12.5px; color: var(--spark-violet); text-decoration: none; font-weight: 500; }
  .auth-error { color: oklch(0.55 0.2 25); font-size: 13px; text-align: center; margin-top: 10px; display: none; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-3); }
  .auth-switch a { color: var(--spark-violet); text-decoration: none; font-weight: 500; }

  .child-picker { margin-top: 24px; display: none; flex-direction: column; gap: 10px; }
  .child-picker.is-show { display: flex; }
  .child-pick { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color .12s; }
  .child-pick:hover { border-color: var(--spark-violet-border); }
  .child-pick-av { width: 44px; height: 44px; border-radius: 50%; background: var(--spark-violet-soft); display: grid; place-items: center; font-size: 20px; flex: 0 0 44px; }
  .child-pick-name { font-size: 16px; font-weight: 600; }
  .child-pick-grade { font-size: 12px; color: var(--text-3); }

</style>
</head>
<body>
<div class="sp">
  <nav class="sp-nav">
    <a class="sp-brand" href="/">
      <span class="sp-brand-mark">K</span>
      <span>Киди</span>
    </a>
    <div class="sp-nav-cta">
      <a class="sp-btn sp-btn-primary" href="/chat/register">Регистрация</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <!-- Step 1: Login form -->
      <div id="step-login">
        <h1 class="auth-h">Войти</h1>
        <p class="auth-sub">Используйте аккаунт Kidion</p>
        <form id="login-form">
          <div class="auth-field">
            <label class="auth-label">Email</label>
            <input class="auth-input" type="email" name="email" required autocomplete="email">
          </div>
          <div class="auth-field">
            <label class="auth-label">Пароль</label>
            <div class="auth-pw-wrap">
              <input class="auth-input" type="password" name="password" id="pw-input" required>
              <button type="button" class="auth-pw-toggle" id="pw-toggle" aria-label="Показать пароль">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9s3-5.5 7.5-5.5S16.5 9 16.5 9s-3 5.5-7.5 5.5S1.5 9 1.5 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </div>
            <div class="auth-forgot"><a href="/forgot-password">Забыли пароль?</a></div>
          </div>
          <button class="sp-btn sp-btn-primary sp-btn-lg auth-btn" type="submit">Войти</button>
        </form>
        <p class="auth-error" id="login-error"></p>
        <p class="auth-switch">Нет аккаунта? <a href="/chat/register">Зарегистрироваться</a></p>
      </div>

      <!-- Step 2: Pick child -->
      <div id="step-child" style="display:none">
        <h1 class="auth-h">Выберите ребёнка</h1>
        <div class="child-picker is-show" id="child-list"></div>
        <p class="auth-error" id="child-error"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  let children = [];

  // Show/hide password toggle
  const pwInput = document.getElementById('pw-input');
  document.getElementById('pw-toggle').addEventListener('click', function() {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    this.innerHTML = show
      ? '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9s3-5.5 7.5-5.5S16.5 9 16.5 9s-3 5.5-7.5 5.5S1.5 9 1.5 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="16" x2="16" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9s3-5.5 7.5-5.5S16.5 9 16.5 9s-3 5.5-7.5 5.5S1.5 9 1.5 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>';
  });

  // Auto-detect if already logged in (e.g. after registration redirect)
  (async function() {
    try {
      const res = await fetch('/api/children', { credentials: 'same-origin' });
      if (res.ok) {
        const data = await res.json();
        children = data.children || data || [];
        if (children.length === 1) {
          authChild(children[0]);
          return;
        } else if (children.length > 1) {
          showChildPicker();
          return;
        }
      }
    } catch(e) {}
  })();

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    const fd = new FormData(this);

    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
    });
    if (!res.ok) {
      const d = await res.json();
      errEl.textContent = d.message || 'Неверный email или пароль';
      errEl.style.display = 'block';
      return;
    }

    // Fetch children
    const childRes = await fetch('/api/children', { credentials: 'same-origin' });
    const childData = await childRes.json();
    children = childData.children || childData || [];

    if (children.length === 0) {
      window.location.href = '/chat/register';
      return;
    }

    if (children.length === 1) {
      authChild(children[0]);
    } else {
      showChildPicker();
    }
  });

  function showChildPicker() {
    document.getElementById('step-login').style.display = 'none';
    document.getElementById('step-child').style.display = '';
    const list = document.getElementById('child-list');
    list.innerHTML = '';
    children.forEach(c => {
      const div = document.createElement('div');
      div.className = 'child-pick';
      div.innerHTML = '<div class="child-pick-av">' + (c.gender === 'girl' ? '👧' : '👦') + '</div><div><div class="child-pick-name">' + c.name + '</div><div class="child-pick-grade">' + c.grade + ' класс</div></div>';
      div.addEventListener('click', () => authChild(c));
      list.appendChild(div);
    });
    if (children.length < 3) {
      const add = document.createElement('a');
      add.href = 'https://kidion.ru/children/new';
      add.className = 'child-pick';
      add.style.cssText = 'border-style:dashed;color:var(--text-3);text-decoration:none';
      add.innerHTML = '<div class="child-pick-av" style="background:var(--surface-2);font-size:18px">+</div><div><div class="child-pick-name" style="color:var(--text-3)">Добавить ребёнка</div></div>';
      list.appendChild(add);
    }
  }

  async function authChild(child) {
    const errEl = document.getElementById('child-error') || document.getElementById('login-error');
    const res = await fetch('/api/kid/auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({ child_id: child.id }),
    });
    if (res.ok) {
      window.location.href = '/chat';
    } else {
      errEl.textContent = 'Ошибка входа';
      errEl.style.display = 'block';
    }
  }
})();
</script>
</body>
</html>
