<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — Киди</title>
<link rel="icon" href="/static/spark/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/spark/chat.css">
<link rel="stylesheet" href="/static/spark/landing.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px; }
  .auth-h { margin: 0 0 6px; font-size: 24px; font-weight: 600; letter-spacing: -0.025em; text-align: center; }
  .auth-sub { margin: 0 0 28px; font-size: 14px; color: var(--text-2); text-align: center; line-height: 1.5; }
  .auth-field { margin-bottom: 14px; }
  .auth-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  .auth-input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; background: var(--surface-2); color: var(--text); outline: none; }
  .auth-input:focus { border-color: var(--spark-violet-border); box-shadow: 0 0 0 3px var(--spark-violet-soft); }
  .auth-btn { width: 100%; margin-top: 8px; }
  .auth-error { color: oklch(0.45 0.2 25); font-size: 14px; font-weight: 500; text-align: center; margin-top: 12px; padding: 10px 14px; background: oklch(0.97 0.02 25); border: 1px solid oklch(0.90 0.05 25); border-radius: 10px; display: none; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-3); }
  .auth-switch a { color: var(--spark-violet); text-decoration: none; font-weight: 500; }

  .auth-children { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
  .auth-children-h { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .auth-children-sub { margin: 0 0 14px; font-size: 12px; color: var(--text-3); }

  .child-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
  .child-row .auth-field { flex: 1; margin-bottom: 0; }
  .child-row .auth-field.gender { flex: 0 0 110px; }
  .child-row .auth-field.grade { flex: 0 0 80px; }

  .child-remove {
    width: 36px; height: 44px; flex: 0 0 36px;
    display: grid; place-items: center;
    background: none; border: 1px solid var(--border); border-radius: 10px;
    color: var(--text-3); cursor: pointer; font-size: 16px;
    transition: background 0.12s, color 0.12s;
  }
  .child-remove:hover { background: oklch(0.97 0.02 25); color: oklch(0.55 0.2 25); }

  .child-add {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px dashed var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; font-weight: 500;
    color: var(--text-3); cursor: pointer; font-family: inherit;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    width: 100%; justify-content: center;
    margin-bottom: 14px;
  }
  .child-add:hover { background: var(--surface-2); color: var(--text-2); border-color: var(--text-3); }
</style>
</head>
<body>
<div class="sp">
  <nav class="sp-nav">
    <a class="sp-brand" href="/">
      <span class="sp-brand-mark">K</span>
      <span>Киди</span>
    </a>
    <div class="sp-nav-cta">
      <a class="sp-btn sp-btn-ghost" href="/chat/login">Войти</a>
    </div>
  </nav>

  <div class="auth-page">
    <form class="auth-card" id="register-form">
      <h1 class="auth-h">Создайте аккаунт</h1>
      <p class="auth-sub">Бесплатно. 10 сообщений в день сразу после регистрации.</p>

      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input class="auth-input" type="email" name="email" required autocomplete="email" placeholder="parent@example.com">
      </div>
      <div class="auth-field">
        <label class="auth-label">Пароль</label>
        <div style="position:relative">
          <input class="auth-input" type="password" name="password" id="reg-pw" required minlength="8" placeholder="Минимум 8 символов" style="padding-right:44px">
          <button type="button" id="reg-pw-toggle" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:6px;line-height:1" aria-label="Показать пароль">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9s3-5.5 7.5-5.5S16.5 9 16.5 9s-3 5.5-7.5 5.5S1.5 9 1.5 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
      </div>

      <div class="auth-children">
        <h3 class="auth-children-h">Дети</h3>
        <p class="auth-children-sub">Добавьте от 1 до 3 детей. Язык нейросети адаптируется под класс.</p>

        <div id="children-list">
          <div class="child-row" data-child="0">
            <div class="auth-field">
              <input class="auth-input" type="text" placeholder="Имя ребёнка" required>
            </div>
            <div class="auth-field gender">
              <select class="auth-input" style="appearance:auto">
                <option value="boy">Мальчик</option>
                <option value="girl">Девочка</option>
              </select>
            </div>
            <div class="auth-field grade">
              <select class="auth-input" style="appearance:auto">
                <option value="1">1 кл</option>
                <option value="2">2 кл</option>
                <option value="3" selected>3 кл</option>
                <option value="4">4 кл</option>
                <option value="5">5 кл</option>
                <option value="6">6 кл</option>
                <option value="7">7 кл</option>
                <option value="8">8 кл</option>
              </select>
            </div>
          </div>
        </div>

        <button type="button" class="child-add" id="btn-add-child">+ Ещё ребёнка</button>
      </div>

      <label style="font-size:12px; color:var(--text-2); display:flex; align-items:flex-start; gap:8px; margin-bottom:12px; line-height:1.45; cursor:pointer;">
        <input type="checkbox" id="reg-consent" required style="margin-top:2px; flex-shrink:0;">
        <span>Мне исполнилось 18&nbsp;лет. Я&nbsp;принимаю <a href="/offer" target="_blank">оферту</a>, <a href="/terms" target="_blank">условия</a> и <a href="/privacy" target="_blank">политику конфиденциальности</a></span>
      </label>
      <button class="sp-btn sp-btn-primary sp-btn-lg auth-btn" type="submit">Начать бесплатно</button>
      <p class="auth-error" id="auth-error"></p>
      <p class="auth-switch">Уже есть аккаунт? <a href="/chat/login">Войти</a></p>
    </form>
  </div>
</div>

<script>
(function() {
  var childCount = 1;
  var maxChildren = 3;
  var listEl = document.getElementById('children-list');
  var addBtn = document.getElementById('btn-add-child');

  // Show/hide password
  var pw = document.getElementById('reg-pw');
  document.getElementById('reg-pw-toggle').addEventListener('click', function() {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.innerHTML = show
      ? '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9s3-5.5 7.5-5.5S16.5 9 16.5 9s-3 5.5-7.5 5.5S1.5 9 1.5 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="16" x2="16" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9s3-5.5 7.5-5.5S16.5 9 16.5 9s-3 5.5-7.5 5.5S1.5 9 1.5 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>';
  });

  // Add child row
  addBtn.addEventListener('click', function() {
    if (childCount >= maxChildren) return;
    var row = document.createElement('div');
    row.className = 'child-row';
    row.dataset.child = childCount;
    row.innerHTML =
      '<div class="auth-field"><input class="auth-input" type="text" placeholder="Имя ребёнка" required></div>' +
      '<div class="auth-field gender"><select class="auth-input" style="appearance:auto">' +
      '<option value="boy">Мальчик</option><option value="girl">Девочка</option></select></div>' +
      '<div class="auth-field grade"><select class="auth-input" style="appearance:auto">' +
      '<option value="1">1 кл</option><option value="2">2 кл</option><option value="3" selected>3 кл</option>' +
      '<option value="4">4 кл</option><option value="5">5 кл</option><option value="6">6 кл</option>' +
      '<option value="7">7 кл</option><option value="8">8 кл</option></select></div>' +
      '<button type="button" class="child-remove" title="Убрать">&times;</button>';
    row.querySelector('.child-remove').addEventListener('click', function() {
      row.remove();
      childCount--;
      if (childCount < maxChildren) addBtn.style.display = '';
    });
    listEl.appendChild(row);
    childCount++;
    if (childCount >= maxChildren) addBtn.style.display = 'none';
    row.querySelector('input').focus();
  });

  // Collect children data from DOM
  function getChildren() {
    var rows = listEl.querySelectorAll('.child-row');
    var children = [];
    rows.forEach(function(row) {
      var name = row.querySelector('input[type="text"]').value.trim();
      var genderSel = row.querySelector('.gender select');
      var gender = genderSel ? genderSel.value : 'boy';
      var gradeSel = row.querySelector('.grade select');
      var grade = parseInt(gradeSel ? gradeSel.value : '3');
      if (name) children.push({ name: name, gender: gender, grade: grade });
    });
    return children;
  }

  // Submit
  document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var errEl = document.getElementById('auth-error');
    var btn = this.querySelector('button[type="submit"]');
    errEl.style.display = 'none';

    var email = this.querySelector('input[name="email"]').value.trim();
    var password = this.querySelector('input[name="password"]').value;
    var children = getChildren();

    if (children.length === 0) {
      errEl.textContent = 'Добавьте хотя бы одного ребёнка';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Создаём аккаунт...';

    function showError(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Начать бесплатно';
    }

    try {
      // 1. Register parent
      var regRes = await fetch('/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin',
        body: JSON.stringify({ email: email, password: password }),
      });
      var regData = await regRes.json();
      if (!regRes.ok) {
        var msg = regData.message || regData.detail || regData.error || '';
        if (msg === 'email_taken') msg = 'Этот email уже зарегистрирован. Попробуйте войти.';
        else if (msg === 'weak_password') msg = 'Пароль слишком короткий (минимум 8 символов).';
        else if (msg === 'invalid_email') msg = 'Некорректный email.';
        else if (!msg) msg = 'Ошибка регистрации';
        return showError(msg);
      }

      // 2. Create all children
      btn.textContent = 'Создаём профили детей...';
      var createdChildren = [];
      for (var i = 0; i < children.length; i++) {
        var childRes = await fetch('/api/children', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          body: JSON.stringify({
            name: children[i].name,
            gender: children[i].gender,
            birth_date: '2018-01-01',
            grade: children[i].grade,
            interests: [],
            source: 'chat',
          }),
        });
        if (childRes.ok) {
          var childData = await childRes.json();
          createdChildren.push(childData);
        }
      }

      if (createdChildren.length === 0) {
        return showError('Не удалось создать профиль ребёнка');
      }

      // 3. If one child — auth and go to chat. If multiple — go to login to pick.
      if (createdChildren.length === 1) {
        await fetch('/api/kid/auth', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          body: JSON.stringify({ child_id: createdChildren[0].id }),
        });
        btn.textContent = 'Готово! Переходим в чат...';
        window.location.href = '/chat';
      } else {
        btn.textContent = 'Готово! Выберите ребёнка...';
        window.location.href = '/chat/login';
      }
    } catch(e) {
      showError('Ошибка сети. Попробуйте ещё раз.');
    }
  });
})();
</script>
</body>
</html>
