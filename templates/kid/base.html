<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22C55E">
  <title>{% block title %}Kidion{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/kid/style.css?v=2">
  {% block head %}{% endblock %}
</head>
<body data-page="{% block page_name %}{% endblock %}">
  {% if child is defined and child %}
  <nav class="kid-nav">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="kid-avatar" id="nav-avatar">
        <a href="/kid/character" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-decoration:none;color:white;">{{ child.name[0]|upper }}</a>
      </div>
      <div>
        <div class="kid-name-greeting">Привет,</div>
        <div class="kid-name">{{ child.name }} 👋</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <a href="/kid/character" class="kid-nav__stars">
        <svg width="18" height="18" viewBox="0 0 24 24" style="display:inline-block;vertical-align:middle;"><path d="M12 2 L14.5 8.5 L21.5 9.2 L16.2 13.8 L17.8 20.6 L12 17 L6.2 20.6 L7.8 13.8 L2.5 9.2 L9.5 8.5 Z" fill="#FFB627" stroke="#FFB627" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span id="star-count">{{ child.stars if child.stars is defined else 0 }}</span>
      </a>
      {% block nav_buttons %}
      <a href="/kid/home" class="btn-home" title="Домой">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 L12 3 L21 12"/><path d="M5 10 V21 H19 V10"/></svg>
      </a>
      {% endblock %}
      <button class="btn-logout" onclick="kidLogout()" title="Выйти">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21 H5 V3 H9"/><path d="M16 17 L21 12 L16 7"/><path d="M21 12 H9"/></svg>
      </button>
    </div>
  </nav>
  {% endif %}
  <main class="kid-main">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/kid/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
