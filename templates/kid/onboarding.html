<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#22C55E">
  <title>Kidion — Знакомство</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/kid/style.css?v=2">
</head>
<body data-page="onboarding">

  <main class="kid-main">
    <div class="onboarding-page">
      <div class="onboarding-halo"></div>

      <div class="onboarding-character">
        <div class="onboarding-character__circle">
          <img
            src="{{ child.character_image_url or '/static/kid/default-character.svg' }}"
            alt="Персонаж"
            class="onboarding-character__img"
            onerror="this.src='/static/kid/default-character.svg'"
          >
        </div>
      </div>

      <div class="onboarding-bubble">
        Привет! Я твой новый друг.<br>Как меня зовут?
      </div>

      <div class="onboarding-input-wrap">
        <input
          type="text"
          id="character-name-input"
          class="onboarding-input"
          placeholder="Искатель"
          maxlength="30"
          autocomplete="off"
        >
      </div>

      <button class="btn btn-primary onboarding-btn" id="onboarding-submit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12 L10 17 L20 7"/></svg>
        Это ты! Готово
      </button>
    </div>
  </main>

  <script>
  (function() {
    var input = document.getElementById('character-name-input');
    var btn = document.getElementById('onboarding-submit');

    btn.addEventListener('click', async function() {
      var name = (input.value || '').trim();
      if (!name) name = 'Искатель';

      btn.disabled = true;
      btn.textContent = '...';

      try {
        var resp = await fetch('/api/kid/character/name', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: name})
        });
        if (resp.ok) {
          window.location.href = '/kid/home';
        } else {
          btn.disabled = false;
          btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12 L10 17 L20 7"/></svg> Это ты! Готово';
        }
      } catch(e) {
        btn.disabled = false;
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12 L10 17 L20 7"/></svg> Это ты! Готово';
      }
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') btn.click();
    });
  })();
  </script>
</body>
</html>
