{% extends "kid/base.html" %}

{% block title %}{{ subject_name }} — Kidion{% endblock %}
{% block page_name %}subject-map{% endblock %}

{% block content %}
<div class="kid-map">
  <div class="kid-map__header">
    <a href="/kid/home" class="btn-back-kid">← Назад</a>
    <h1 class="kid-map__title">{{ subject_name }}</h1>
    <div class="kid-map__stats" id="map-stats"></div>
  </div>

  <div class="lesson-map" id="lesson-map">
    <div class="spinner"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var SUBJECT = '{{ subject }}';

(async () => {
  try {
    var resp = await fetch('/api/kid/subject/' + SUBJECT + '/map', {credentials: 'same-origin'});
    if (!resp.ok) {
      document.getElementById('lesson-map').innerHTML = '<div class="empty-state-kid"><div class="empty-state-icon">📚</div><div class="empty-state-text">Попроси маму или папу открыть этот предмет!</div></div>';
      return;
    }
    var data = await resp.json();
    renderMap(data);
  } catch(e) {
    document.getElementById('lesson-map').innerHTML = '<p style="text-align:center;color:#888">Ошибка загрузки</p>';
  }
})();

function renderMap(data) {
  // Stats
  var statsEl = document.getElementById('map-stats');
  statsEl.innerHTML = '<span>⭐ ' + (data.total_stars || 0) + '</span> · <span>' + (data.completed_lessons || 0) + '/' + (data.total_lessons || 0) + '</span>';

  var topics = data.topics || [];
  var mapEl = document.getElementById('lesson-map');
  var html = '';

  for (var i = 0; i < topics.length; i++) {
    var topic = topics[i];
    var lessons = topic.lessons || [];

    // Topic header
    html += '<div class="map-topic">';
    html += '<div class="map-topic__header">';
    html += '<span class="map-topic__icon">' + (topic.icon || '📖') + '</span>';
    html += '<span class="map-topic__title">' + esc(topic.title_ru) + '</span>';
    html += '</div>';

    // Lesson nodes (vertical path)
    html += '<div class="map-lessons">';
    for (var j = 0; j < lessons.length; j++) {
      var l = lessons[j];
      var nodeClass = 'map-node map-node--' + l.status;
      var offset = (j % 2 === 0) ? 'map-node--left' : 'map-node--right';

      html += '<div class="' + nodeClass + ' ' + offset + '">';

      // Connector line
      if (j > 0) {
        html += '<div class="map-connector"></div>';
      }

      html += '<div class="map-node__circle">';

      if (l.status === 'completed') {
        var starsHtml = '';
        for (var s = 0; s < 5; s++) {
          starsHtml += '<span class="map-star ' + (s < l.stars_earned ? 'earned' : '') + '">⭐</span>';
        }
        html += '<span class="map-node__check">✅</span>';
        html += '</div>';
        html += '<div class="map-node__info">';
        html += '<div class="map-node__title">' + esc(l.title_ru) + '</div>';
        html += '<div class="map-node__stars">' + starsHtml + '</div>';
        if (l.lesson_id) {
          html += '<a href="/kid/lesson/' + l.lesson_id + '" class="btn-replay-kid">Повторить</a>';
        }
        html += '</div>';
      } else if (l.status === 'available') {
        if (l.lesson_id) {
          html += '<span class="map-node__play">▶</span>';
          html += '</div>';
          html += '<div class="map-node__info">';
          html += '<div class="map-node__title">' + esc(l.title_ru) + '</div>';
          html += '<a href="/kid/lesson/' + l.lesson_id + '" class="btn-play-kid">Играть!</a>';
        } else {
          html += '<span class="map-node__waiting">⏳</span>';
          html += '</div>';
          html += '<div class="map-node__info">';
          html += '<div class="map-node__title">' + esc(l.title_ru) + '</div>';
          html += '<span class="map-node__hint">Ожидает генерации</span>';
        }
        html += '</div>';
      } else if (l.status === 'test') {
        html += '<span class="map-node__test">📋</span>';
        html += '</div>';
        html += '<div class="map-node__info">';
        html += '<div class="map-node__title">Тест: ' + esc(l.title_ru) + '</div>';
        if (l.lesson_id) {
          html += '<a href="/kid/lesson/' + l.lesson_id + '" class="btn-play-kid btn-play-kid--test">Пройти тест!</a>';
        }
        html += '</div>';
      } else {
        // locked
        html += '<span class="map-node__lock">🔒</span>';
        html += '</div>';
        html += '<div class="map-node__info">';
        html += '<div class="map-node__title map-node__title--locked">' + esc(l.title_ru) + '</div>';
        html += '</div>';
      }

      html += '</div>'; // .map-node
    }
    html += '</div>'; // .map-lessons
    html += '</div>'; // .map-topic
  }

  mapEl.innerHTML = html;
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
