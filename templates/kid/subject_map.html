{% extends "kid/base.html" %}

{% block title %}{{ subject_name }} — Kidion{% endblock %}
{% block page_name %}subject-map{% endblock %}

{% block head %}
<style>
  body[data-page="subject-map"] .kid-main { padding:0; }

  .smap { background:#fff; min-height:calc(100vh - 60px); }

  /* ── Strip header ── */
  .smap__strip {
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; border-bottom:2px solid rgba(15,36,24,0.08);
  }
  .smap__strip-back {
    width:38px; height:38px; border-radius:50%; border:none;
    background:#F6FAF4; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; text-decoration:none; color:#0F2418;
  }
  .smap__strip-icon {
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
  }
  .smap__strip-subject { font-size:10px; font-weight:800; color:#7E9786; letter-spacing:1.2px; text-transform:uppercase; }
  .smap__strip-topic { font-size:14px; font-weight:800; letter-spacing:-0.3px; }
  .smap__strip-stats { text-align:right; flex-shrink:0; }
  .smap__strip-num { font-size:16px; font-weight:800; color:#15803D; letter-spacing:-0.3px; }
  .smap__strip-label { font-size:9px; color:#7E9786; font-weight:700; }

  /* ── Tooltip ── */
  .smap__tip {
    display:flex; align-items:center; gap:10px;
    background:#FF6B5B; color:#fff; border-radius:14px;
    padding:12px 16px; margin:12px 16px; font-size:14px; font-weight:700;
    box-shadow: 0 3px 0 #E8503F;
  }
  .smap__tip-text { flex:1; }
  .smap__tip-close { background:none; border:none; color:#fff; opacity:0.7; font-size:16px; cursor:pointer; }

  /* ── Journey area ── */
  .smap__journey {
    position:relative; padding:24px 0 40px; min-height:400px;
  }

  /* SVG path behind stones */
  .smap__path {
    position:absolute; left:0; right:0; top:0; bottom:0;
    pointer-events:none; z-index:0;
  }

  /* ── Topic header ── */
  .smap__topic {
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; background:#fff; border-radius:16px;
    box-shadow: 0 4px 0 rgba(15,36,24,0.08), 0 0 0 1.5px rgba(15,36,24,0.08);
    margin:0 16px 24px;
    position:relative; z-index:1;
  }
  .smap__topic-icon { font-size:24px; }
  .smap__topic-title { font-size:16px; font-weight:800; flex:1; }

  /* ── Stone (lesson card) ── */
  .smap__stones {
    display:flex; flex-direction:column; align-items:center;
    position:relative; z-index:1;
  }

  .smap__row {
    width:100%; display:flex; padding:8px 0;
  }
  .smap__row--left  { justify-content:flex-start; padding-left:10%; }
  .smap__row--right { justify-content:flex-end;   padding-right:10%; }
  .smap__row--center { justify-content:center; }

  .smap__stone {
    position:relative; width:120px; cursor:pointer;
    transition: transform 0.1s;
  }
  .smap__stone:active { transform:scale(0.95); }

  /* Number badge */
  .smap__badge {
    position:absolute; left:-8px; top:-8px; z-index:3;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800;
    box-shadow: 0 0 0 2.5px #fff;
  }
  .smap__badge--done    { background:#FFB627; color:#0F2418; box-shadow:0 2px 0 #F59E0B, 0 0 0 2.5px #fff; }
  .smap__badge--current { background:#fff;    color:#E8503F; box-shadow:0 2px 0 #E8503F, 0 0 0 2.5px #fff; }
  .smap__badge--locked  { background:#C9B8AB; color:#fff;    box-shadow:0 2px 0 #9A8478, 0 0 0 2.5px #fff; }

  /* Card face */
  .smap__card {
    border-radius:22px; padding:16px 10px 14px; text-align:center;
  }
  .smap__card--done {
    background:#fff;
    box-shadow: 0 4px 0 #F59E0B, 0 0 0 2px #FFB627;
  }
  .smap__card--current {
    background:#FF6B5B;
    box-shadow: 0 6px 0 #E8503F, 0 0 0 2.5px #E8503F, 0 12px 28px rgba(232,80,63,0.35);
    transform: translateY(-6px);
  }
  .smap__card--locked {
    background:#F2EAE2;
    box-shadow: 0 4px 0 #D7C9BC, 0 0 0 2px #D7C9BC;
  }

  .smap__icon { font-size:32px; line-height:1; }
  .smap__icon--locked { filter:grayscale(1) opacity(0.55); }

  .smap__title { font-size:11px; font-weight:800; margin-top:8px; line-height:1.2; letter-spacing:-0.1px; }
  .smap__title--done    { color:#0F2418; }
  .smap__title--current { color:#fff; }
  .smap__title--locked  { color:#7E9786; }

  .smap__stars { display:flex; gap:2px; justify-content:center; margin-top:8px; }

  .smap__cta {
    margin-top:6px; font-size:10px; font-weight:800;
    color:#fff; letter-spacing:1px; text-transform:uppercase;
  }

  /* Connector dots between stones */
  .smap__connector {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:4px 0;
    position:relative; z-index:0;
  }
  .smap__dot {
    width:5px; height:5px; border-radius:50%;
    background:#22C55E; opacity:0.3;
  }

  /* ── Empty ── */
  .smap__empty { text-align:center; padding:60px 20px; }
</style>
{% endblock %}

{% block content %}
<div class="smap">
  <div class="smap__strip">
    <a href="/kid/home" class="smap__strip-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 6 L9 12 L15 18"/></svg>
    </a>
    <div class="smap__strip-icon" id="map-icon">📚</div>
    <div style="flex:1;min-width:0;">
      <div class="smap__strip-subject">{{ subject_name }}</div>
      <div class="smap__strip-topic" id="map-topic"></div>
    </div>
    <div class="smap__strip-stats" id="map-stats"></div>
  </div>

  <div class="smap__tip" id="map-tip" style="display:none">
    <span class="smap__tip-text">Жми на открытый уровень!</span>
    <button class="smap__tip-close" onclick="this.parentNode.style.display='none';localStorage.setItem('map_tip','1')">✕</button>
  </div>

  <div id="lesson-map"><div class="spinner" style="margin:60px auto;"></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
var SUBJECT = '{{ subject }}';
var SC = {
  math:    {color:'#22C55E',deep:'#15803D',grad:'linear-gradient(135deg,#22C55E,#15803D)',icon:'🔢'},
  russian: {color:'#2DD4BF',deep:'#0EA5A0',grad:'linear-gradient(135deg,#2DD4BF,#0EA5A0)',icon:'✍️'},
  world:   {color:'#A78BFA',deep:'#7C3AED',grad:'linear-gradient(135deg,#A78BFA,#7C3AED)',icon:'🌍'}
}[SUBJECT] || {color:'#22C55E',deep:'#15803D',grad:'linear-gradient(135deg,#22C55E,#15803D)',icon:'📚'};

var mapIcon = document.getElementById('map-icon');
if (mapIcon) { mapIcon.style.background = SC.grad; mapIcon.textContent = SC.icon; }

if (!localStorage.getItem('map_tip')) document.getElementById('map-tip').style.display = '';

var ICONS = ['🔢','✏️','➕','➖','🧩','⚖️','✨','📐','🎯','📊','🔬','🌟'];

(async () => {
  try {
    var resp = await fetch('/api/kid/subject/' + SUBJECT + '/map', {credentials:'same-origin'});
    if (!resp.ok) {
      document.getElementById('lesson-map').innerHTML = '<div class="smap__empty"><div style="font-size:48px;margin-bottom:12px;">📚</div><div style="font-size:16px;color:#7E9786;font-weight:600;">Попроси маму или папу открыть этот предмет!</div></div>';
      return;
    }
    renderMap(await resp.json());
  } catch(e) {
    document.getElementById('lesson-map').innerHTML = '<p style="text-align:center;color:#7E9786;padding:40px;">Ошибка загрузки</p>';
  }
})();

function renderMap(data) {
  var statsEl = document.getElementById('map-stats');
  statsEl.innerHTML = '<div class="smap__strip-num">' + (data.completed_lessons||0) + ' / ' + (data.total_lessons||0) + '</div><div class="smap__strip-label">уроков</div>';

  var topics = data.topics || [];
  var mapEl = document.getElementById('lesson-map');
  if (topics.length > 0 && topics[0].title_ru) {
    document.getElementById('map-topic').textContent = topics[0].title_ru;
  }

  var html = '';
  var gi = 0; // global lesson index across topics

  for (var i = 0; i < topics.length; i++) {
    var topic = topics[i];
    var lessons = topic.lessons || [];

    html += '<div class="smap__topic"><span class="smap__topic-icon">' + (topic.icon||'📖') + '</span><span class="smap__topic-title">' + esc(topic.title_ru) + '</span></div>';
    html += '<div class="smap__stones">';

    for (var j = 0; j < lessons.length; j++) {
      var l = lessons[j];
      var st = l.status; // completed, available, locked
      var ds = st === 'completed' ? 'done' : (st === 'available' ? 'current' : 'locked');
      var icon = ICONS[gi % ICONS.length];
      gi++;

      // Zigzag: left, right, center for current
      var sides = ['left','right'];
      var side = (st === 'available') ? 'center' : sides[j % 2];

      // Connector dots before each stone (except first)
      if (j > 0) {
        html += '<div class="smap__connector"><div class="smap__dot"></div><div class="smap__dot"></div><div class="smap__dot"></div></div>';
      }

      html += '<div class="smap__row smap__row--' + side + '">';
      html += '<div class="smap__stone" data-lesson-id="' + (l.lesson_id||'') + '" data-status="' + st + '">';

      // Badge
      html += '<div class="smap__badge smap__badge--' + ds + '">';
      if (ds === 'locked') {
        html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M 8 11 V 7 Q 8 3 12 3 Q 16 3 16 7 V 11" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
      } else {
        html += (j + 1);
      }
      html += '</div>';

      // Card
      html += '<div class="smap__card smap__card--' + ds + '">';
      html += '<div class="smap__icon' + (ds==='locked'?' smap__icon--locked':'') + '">' + icon + '</div>';
      html += '<div class="smap__title smap__title--' + ds + '">' + esc(l.title_ru) + '</div>';

      // Stars
      if (ds !== 'locked') {
        html += '<div class="smap__stars">';
        for (var s = 0; s < 3; s++) {
          var earned = ds === 'done' && s < (l.stars_earned || 0);
          var c = ds === 'current' ? '#fff' : (earned ? '#FFB627' : 'rgba(15,36,24,0.08)');
          html += '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2 L14.5 8.5 L21.5 9.2 L16.2 13.8 L17.8 20.6 L12 17 L6.2 20.6 L7.8 13.8 L2.5 9.2 L9.5 8.5 Z" fill="' + c + '" stroke="' + c + '" stroke-width="1.5" stroke-linejoin="round"/></svg>';
        }
        html += '</div>';
      }

      if (ds === 'current') {
        html += '<div class="smap__cta">Тук! →</div>';
      }

      html += '</div>'; // card
      html += '</div>'; // stone
      html += '</div>'; // row
    }

    html += '</div>'; // stones
  }

  mapEl.innerHTML = html;

  // Click handlers
  mapEl.querySelectorAll('.smap__stone').forEach(function(stone) {
    var lid = stone.dataset.lessonId;
    var st = stone.dataset.status;
    if (lid && (st === 'completed' || st === 'available')) {
      stone.addEventListener('click', function() {
        window.location.href = '/kid/lesson/' + lid;
      });
    } else {
      stone.style.cursor = 'default';
    }
  });
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
{% endblock %}
