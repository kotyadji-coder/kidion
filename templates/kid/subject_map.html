{% extends "kid/base.html" %}

{% block title %}{{ subject_name }} — Kidion{% endblock %}
{% block page_name %}subject-map{% endblock %}

{% block content %}
<div class="kid-map">
  <!-- Topic strip header -->
  <div class="kid-map__strip">
    <a href="/kid/home" class="btn-back-kid">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 6 L9 12 L15 18"/></svg>
    </a>
    <div class="kid-map__strip-icon" id="map-icon">📚</div>
    <div style="flex:1; min-width:0;">
      <div class="kid-map__strip-subject" id="map-subject-label">{{ subject_name }}</div>
      <div class="kid-map__strip-topic" id="map-topic-title"></div>
    </div>
    <div class="kid-map__strip-stats" id="map-stats"></div>
  </div>

  <!-- First-visit tooltip -->
  <div class="map-tooltip" id="map-tooltip" style="display:none">
    <span class="map-tooltip__text">Жми на открытый уровень, чтобы начать!</span>
    <button class="map-tooltip__close" onclick="this.parentNode.style.display='none'; localStorage.setItem('map_tooltip_seen','1')">✕</button>
  </div>

  <!-- Lesson map area -->
  <div class="map-journey" id="lesson-map">
    <div class="spinner"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var SUBJECT = '{{ subject }}';
var SUBJECT_CONFIG = {
  math:    { color: '#22C55E', deep: '#15803D', gradient: 'linear-gradient(135deg, #22C55E, #15803D)', icon: '🔢' },
  russian: { color: '#2DD4BF', deep: '#0EA5A0', gradient: 'linear-gradient(135deg, #2DD4BF, #0EA5A0)', icon: '✍️' },
  world:   { color: '#A78BFA', deep: '#7C3AED', gradient: 'linear-gradient(135deg, #A78BFA, #7C3AED)', icon: '🌍' }
};

var sc = SUBJECT_CONFIG[SUBJECT] || SUBJECT_CONFIG.math;
var mapIcon = document.getElementById('map-icon');
if (mapIcon) {
  mapIcon.style.background = sc.gradient;
  mapIcon.textContent = sc.icon;
}

if (!localStorage.getItem('map_tooltip_seen')) {
  document.getElementById('map-tooltip').style.display = '';
}

// Lesson icons by index (cycle through)
var LESSON_ICONS = ['🔢', '✏️', '➕', '➖', '🧩', '⚖️', '✨', '📐', '🎯', '📊'];

(async () => {
  try {
    var resp = await fetch('/api/kid/subject/' + SUBJECT + '/map', {credentials: 'same-origin'});
    if (!resp.ok) {
      document.getElementById('lesson-map').innerHTML = '<div class="map-empty"><div style="font-size:48px;margin-bottom:12px;">📚</div><div style="font-size:16px;color:#7E9786;font-weight:600;">Попроси маму или папу открыть этот предмет!</div></div>';
      return;
    }
    var data = await resp.json();
    renderMap(data);
  } catch(e) {
    document.getElementById('lesson-map').innerHTML = '<p style="text-align:center;color:#7E9786;padding:40px;">Ошибка загрузки</p>';
  }
})();

function renderMap(data) {
  // Stats
  var statsEl = document.getElementById('map-stats');
  statsEl.innerHTML = '<div class="kid-map__strip-stats-num">' + (data.completed_lessons || 0) + ' / ' + (data.total_lessons || 0) + '</div><div class="kid-map__strip-stats-label">уроков</div>';

  var topics = data.topics || [];
  var mapEl = document.getElementById('lesson-map');
  var html = '';
  var globalLessonIdx = 0;

  // Set first topic title
  if (topics.length > 0) {
    var topicTitle = document.getElementById('map-topic-title');
    if (topicTitle) topicTitle.textContent = topics[0].title_ru || '';
  }

  for (var i = 0; i < topics.length; i++) {
    var topic = topics[i];
    var lessons = topic.lessons || [];

    // Topic section
    html += '<div class="map-topic-section">';

    // Topic header card
    html += '<div class="map-topic-card">';
    html += '<span class="map-topic-card__icon">' + (topic.icon || '📖') + '</span>';
    html += '<span class="map-topic-card__title">' + esc(topic.title_ru) + '</span>';
    html += '</div>';

    // Stones container with path
    html += '<div class="map-stones">';

    for (var j = 0; j < lessons.length; j++) {
      var l = lessons[j];
      var lessonIcon = LESSON_ICONS[globalLessonIdx % LESSON_ICONS.length];
      globalLessonIdx++;

      // Map status from API to design status
      var status = l.status; // completed, available, locked
      if (status === 'available' && !l.lesson_id) status = 'waiting';

      // Zigzag position
      var side = (j % 2 === 0) ? 'left' : 'right';

      html += '<div class="map-stone map-stone--' + status + ' map-stone--' + side + '">';

      // Number badge
      html += '<div class="map-stone__badge map-stone__badge--' + status + '">';
      if (status === 'locked') {
        html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M 8 11 V 7 Q 8 3 12 3 Q 16 3 16 7 V 11" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
      } else {
        html += (j + 1);
      }
      html += '</div>';

      // Card body
      html += '<div class="map-stone__card map-stone__card--' + status + '">';

      // Emoji icon
      html += '<div class="map-stone__icon' + (status === 'locked' ? ' map-stone__icon--locked' : '') + '">' + lessonIcon + '</div>';

      // Title
      html += '<div class="map-stone__title map-stone__title--' + status + '">' + esc(l.title_ru) + '</div>';

      // Stars (for completed and available)
      if (status !== 'locked' && status !== 'waiting') {
        html += '<div class="map-stone__stars">';
        for (var s = 0; s < 3; s++) {
          var earned = status === 'completed' && s < (l.stars_earned || 0);
          var starColor = status === 'available' ? '#fff' : (earned ? '#FFB627' : 'rgba(15,36,24,0.08)');
          html += '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2 L14.5 8.5 L21.5 9.2 L16.2 13.8 L17.8 20.6 L12 17 L6.2 20.6 L7.8 13.8 L2.5 9.2 L9.5 8.5 Z" fill="' + starColor + '" stroke="' + starColor + '" stroke-width="1.5" stroke-linejoin="round"/></svg>';
        }
        html += '</div>';
      }

      // Action for available
      if (status === 'available' && l.lesson_id) {
        html += '<div class="map-stone__cta">Тук! →</div>';
        // Wrap card in link
      }

      // Replay for completed
      if (status === 'completed' && l.lesson_id) {
        // link handled below
      }

      html += '</div>'; // .map-stone__card

      // Link wrapper
      if ((status === 'available' || status === 'completed') && l.lesson_id) {
        // Re-wrap: we need to make the whole stone clickable
        // Done via JS click handler instead
      }

      html += '</div>'; // .map-stone

      // Connector line between stones
      if (j < lessons.length - 1) {
        html += '<div class="map-stone__connector"></div>';
      }
    }

    html += '</div>'; // .map-stones
    html += '</div>'; // .map-topic-section
  }

  mapEl.innerHTML = html;

  // Make clickable stones
  mapEl.querySelectorAll('.map-stone--completed, .map-stone--available').forEach(function(stone) {
    stone.style.cursor = 'pointer';
    stone.addEventListener('click', function() {
      // Find lesson_id from the data
      var badge = stone.querySelector('.map-stone__badge');
      if (!badge) return;
      var num = parseInt(badge.textContent);
      if (isNaN(num)) return;
      // Find the lesson
      var allLessons = [];
      for (var ti = 0; ti < topics.length; ti++) {
        allLessons = allLessons.concat(topics[ti].lessons || []);
      }
      var lesson = allLessons[num - 1];
      if (lesson && lesson.lesson_id) {
        window.location.href = '/kid/lesson/' + lesson.lesson_id;
      }
    });
  });
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
