{% extends "kid/base.html" %}

{% block title %}Mой персонаж — Kidion{% endblock %}
{% block page_name %}character{% endblock %}

{% block head %}
<style>
  /* Desktop: hide full kid-nav, show only back arrow */
  @media (min-width: 1100px) {
    body[data-page="character"] .kid-nav { display: none; }
    body[data-page="character"] .kid-main { padding: 0; max-width: 100%; }
  }
  /* Mobile: hide full kid-nav, show only back arrow */
  @media (max-width: 1099px) {
    body[data-page="character"] .kid-nav { display: none; }
    body[data-page="character"] .kid-main { padding: 0; max-width: 100%; }
  }
</style>
{% endblock %}

{% block content %}
<!-- Desktop back arrow -->
<a class="char-back-arrow" href="/kid/home" title="Назад">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>

<div class="char-app" id="char-app">

  <!-- ============ STAGE ============ -->
  <section class="char-stage" id="char-stage">
    <!-- Scene backgrounds -->
    <div class="char-scene char-scene--forest char-scene--active" data-scene="forest">
      <div class="char-scene__sun"></div>
      <div class="char-scene__hill char-scene__hill--1"></div>
      <div class="char-scene__hill char-scene__hill--2"></div>
      <div class="char-scene__tree char-scene__tree--1"></div>
      <div class="char-scene__tree char-scene__tree--2"></div>
      <div class="char-scene__tree char-scene__tree--3"></div>
    </div>
    <div class="char-scene char-scene--space" data-scene="space">
      <div class="char-scene__planet"></div>
      <div class="char-scene__moon"></div>
      <div class="char-scene__star" style="top:10%;left:10%"></div>
      <div class="char-scene__star" style="top:18%;left:42%;animation-delay:.6s"></div>
      <div class="char-scene__star" style="top:14%;left:70%;animation-delay:.3s"></div>
      <div class="char-scene__star" style="top:38%;left:28%;animation-delay:.9s"></div>
      <div class="char-scene__star" style="top:64%;left:60%;animation-delay:.8s"></div>
    </div>
    <div class="char-scene char-scene--room" data-scene="room">
      <div class="char-scene__window"></div>
      <div class="char-scene__lamp"></div>
      <div class="char-scene__floor"></div>
    </div>
    <div class="char-scene char-scene--castle" data-scene="castle">
      <div class="char-scene__tower char-scene__tower--l"><div class="char-scene__flag"></div></div>
      <div class="char-scene__tower char-scene__tower--m"><div class="char-scene__flag"></div><div class="char-scene__door"></div></div>
      <div class="char-scene__tower char-scene__tower--r"><div class="char-scene__flag"></div></div>
    </div>

    <!-- Sparkle FX -->
    <div class="char-fx" id="char-fx">
      <div class="char-fx__spark char-fx__spark--1"></div>
      <div class="char-fx__spark char-fx__spark--2"></div>
      <div class="char-fx__spark char-fx__spark--3"></div>
      <div class="char-fx__spark char-fx__spark--4"></div>
    </div>

    <!-- Scene selector chips — top center -->
    <div class="char-scene-rail" id="char-scene-rail">
      <button class="char-scene-chip char-scene-chip--active" data-scene="forest"><span class="char-scene-chip__swatch char-scene-chip__swatch--forest"></span>Лес</button>
      <button class="char-scene-chip" data-scene="space"><span class="char-scene-chip__swatch char-scene-chip__swatch--space"></span>Космос</button>
      <button class="char-scene-chip" data-scene="room"><span class="char-scene-chip__swatch char-scene-chip__swatch--room"></span>Комната</button>
      <button class="char-scene-chip" data-scene="castle"><span class="char-scene-chip__swatch char-scene-chip__swatch--castle"></span>Замок</button>
    </div>

    <!-- Purchase burst -->
    <div class="char-burst" id="char-burst"></div>

    <!-- Character image + name below -->
    <div class="char-image-wrap">
      <div class="char-image-col">
        <div class="char-image-float" id="char-image-float">
          <img src="/static/kid/default-character.svg" alt="character" class="char-image" id="char-image" onerror="this.src='/static/kid/default-character.svg'">
        </div>
        <div class="char-bottom-name">
          <div class="char-top__name" id="char-top-name">
            <span class="char-top__name-text" id="char-name-display"></span>
            <button class="char-top__name-edit" onclick="editCharacterName()" title="Rename">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3 L21 8 L8 21 H3 V16 Z"/></svg>
            </button>
          </div>
          <div class="char-top__name-form" id="char-name-form" style="display:none">
            <input type="text" id="char-name-input" class="char-top__name-input" maxlength="30">
            <button class="char-top__name-btn char-top__name-btn--save" onclick="saveCharacterName()">&#10003;</button>
            <button class="char-top__name-btn char-top__name-btn--cancel" onclick="cancelEditName()">&#10005;</button>
          </div>
        </div>
      </div>
    </div>

  </section>

  <!-- ============ SHOP SHEET ============ -->
  <section class="char-shop" id="char-shop">
    <div class="char-shop__head">
      <h2 class="char-shop__title">Магазин</h2>
      <span class="char-shop__stars" id="char-shop-stars">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 5.6 6.1.7-4.6 4.2 1.3 6L12 16.1 6.6 19l1.3-6L3.3 8.8l6.1-.7L12 2.5z"/></svg>
        <span id="shop-star-count">0</span>
      </span>
    </div>

    <!-- Category tabs -->
    <div class="char-cat-rail" id="char-cat-rail"></div>

    <!-- Item grid -->
    <div class="char-grid" id="char-grid">
      <div class="spinner"></div>
    </div>
  </section>

</div>

<!-- Toast -->
<div class="char-toast" id="char-toast">
  <span class="char-toast__ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 5.6 6.1.7-4.6 4.2 1.3 6L12 16.1 6.6 19l1.3-6L3.3 8.8l6.1-.7L12 2.5z"/></svg></span>
  <span id="char-toast-text"></span>
</div>
{% endblock %}

{% block scripts %}
<script>
var CATEGORY_NAMES = {
  outfit: 'Одежда',
  accessory: 'Аксессуары',
  pet: 'Питомцы',
  background: 'Фоны'
};
var HIDDEN_CATEGORIES = {special: true};

var CATEGORY_ICONS = {
  outfit: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7l4-3h2a2 2 0 0 0 4 0h2l4 3-2 4-3-1v9H7v-9l-3 1z" fill="currentColor"/></svg>',
  accessory: '<svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="12" r="4" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M11 12h2" stroke="currentColor" stroke-width="2"/></svg>',
  pet: '<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="9" r="2" fill="currentColor"/><circle cx="18" cy="9" r="2" fill="currentColor"/><circle cx="9" cy="5" r="1.8" fill="currentColor"/><circle cx="15" cy="5" r="1.8" fill="currentColor"/><path d="M12 11c4 0 6 3 6 5s-2 3-6 3-6-1-6-3 2-5 6-5z" fill="currentColor"/></svg>',
  background: '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 16l5-5 4 4 3-3 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/></svg>',
  special: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5l2.6 5.6 6.1.7-4.6 4.2 1.3 6L12 16.1 6.6 19l1.3-6L3.3 8.8l6.1-.7L12 2.5z" fill="currentColor"/></svg>'
};

var currentStars = 0;
var currentCat = '';
var shopData = {};
var toastTimer;

(async () => {
  try {
    var resp = await fetch('/api/kid/character', {credentials: 'same-origin'});
    if (!resp.ok) throw new Error('Failed to load');
    var data = await resp.json();
    currentStars = data.stars || 0;
    renderPage(data);
  } catch(e) {
    document.getElementById('char-grid').innerHTML =
      '<div class="char-empty"><div class="char-empty__pic">&#127918;</div><div class="char-empty__title">Не удалось загрузить</div></div>';
  }
})();

function renderPage(data) {
  var charName = data.character_name || 'Искатель';
  shopData = data.shop || {};

  // Character name
  document.getElementById('char-name-display').textContent = charName;
  document.getElementById('char-name-input').value = charName;

  // Character image
  var imgSrc = data.character_image_url || '/static/kid/default-character.svg';
  document.getElementById('char-image').src = imgSrc + '?t=' + Date.now();

  // Stars balance
  updateBalance();

  // Category tabs
  var categories = Object.keys(shopData).filter(function(c) { return !HIDDEN_CATEGORIES[c]; });
  if (categories.length > 0) {
    currentCat = categories[0];
    renderCategoryTabs(categories);
    renderGrid();
  } else {
    document.getElementById('char-cat-rail').innerHTML = '';
    document.getElementById('char-grid').innerHTML =
      '<div class="char-empty"><div class="char-empty__pic">&#127978;</div><div class="char-empty__title">Магазин готовится...</div><p class="char-empty__text">Скоро здесь появятся новые штуки!</p></div>';
  }

  // Init scene rail
  initSceneRail();
}

function updateBalance() {
  var navStars = document.getElementById('star-count');
  if (navStars) navStars.textContent = currentStars;
  var shopStars = document.getElementById('shop-star-count');
  if (shopStars) shopStars.textContent = currentStars;
}

function renderCategoryTabs(categories) {
  var rail = document.getElementById('char-cat-rail');
  var html = '';
  for (var i = 0; i < categories.length; i++) {
    var cat = categories[i];
    var active = cat === currentCat ? ' char-cat--active' : '';
    var icon = CATEGORY_ICONS[cat] || CATEGORY_ICONS.background;
    var newCount = 0;
    (shopData[cat] || []).forEach(function(it) { if (!it.purchased) newCount++; });
    html += '<button class="char-cat' + active + '" data-cat="' + cat + '" onclick="switchCategory(\'' + cat + '\')">';
    html += '<span class="char-cat__ico">' + icon + '</span>';
    html += '<span class="char-cat__label">' + (CATEGORY_NAMES[cat] || cat) + '</span>';
    if (newCount > 0) html += '<span class="char-cat__badge">' + newCount + '</span>';
    html += '</button>';
  }
  rail.innerHTML = html;
}

function renderGrid() {
  var grid = document.getElementById('char-grid');
  var items = shopData[currentCat] || [];

  if (!items.length) {
    grid.innerHTML = '<div class="char-empty"><div class="char-empty__pic">&#10024;</div><div class="char-empty__title">Скоро здесь появятся новые штуки!</div><p class="char-empty__text">Возвращайся завтра.</p></div>';
    return;
  }

  var html = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var state = 'buy';
    if (it.purchased && it.equipped) state = 'equipped';
    else if (it.purchased) state = 'owned';
    else if (currentStars < it.price_stars) state = 'locked';

    html += '<button class="char-item char-item--' + state + '" data-id="' + it.id + '" onclick="onItemClick(' + it.id + ')">';

    // State badges
    if (state === 'equipped') {
      html += '<span class="char-item__ribbon">Надето</span>';
    }
    if (state === 'owned') {
      html += '<span class="char-item__check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    }
    if (state === 'locked') {
      html += '<span class="char-item__lock"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="2.5" fill="none"/></svg></span>';
    }

    // Art area with emoji
    html += '<span class="char-item__art"><span class="char-item__emoji">' + esc(it.emoji) + '</span></span>';

    // Name
    html += '<span class="char-item__name">' + esc(it.title_ru) + '</span>';

    // Bottom action
    if (state === 'buy') {
      html += '<span class="char-item__price"><span class="char-item__star"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 5.6 6.1.7-4.6 4.2 1.3 6L12 16.1 6.6 19l1.3-6L3.3 8.8l6.1-.7L12 2.5z"/></svg></span>' + it.price_stars + '</span>';
    } else if (state === 'locked') {
      html += '<span class="char-item__price char-item__price--locked"><span class="char-item__star"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 5.6 6.1.7-4.6 4.2 1.3 6L12 16.1 6.6 19l1.3-6L3.3 8.8l6.1-.7L12 2.5z"/></svg></span>' + it.price_stars + '</span>';
    } else if (state === 'owned') {
      html += '<span class="char-item__equip-btn">Надеть</span>';
    } else if (state === 'equipped') {
      html += '<span class="char-item__equipped-label"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Надето</span>';
    }

    html += '</button>';
  }
  grid.innerHTML = html;
}

function switchCategory(cat) {
  currentCat = cat;
  var tabs = document.querySelectorAll('.char-cat');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('char-cat--active', tabs[i].getAttribute('data-cat') === cat);
  }
  renderGrid();
}

async function onItemClick(itemId) {
  var items = shopData[currentCat] || [];
  var item = null;
  for (var i = 0; i < items.length; i++) {
    if (items[i].id === itemId) { item = items[i]; break; }
  }
  if (!item) return;

  if (item.purchased && item.equipped) {
    // Unequip
    await toggleEquip(itemId, false);
    return;
  }
  if (item.purchased && !item.equipped) {
    // Equip
    await toggleEquip(itemId, true);
    return;
  }
  if (!item.purchased && currentStars < item.price_stars) {
    // Not enough stars
    showToast('Нужно ещё немного поучиться!');
    shakeItem(itemId);
    return;
  }
  // Buy
  await buyItem(itemId);
}

async function buyItem(itemId) {
  var btn = document.querySelector('.char-item[data-id="' + itemId + '"]');
  if (btn) btn.style.pointerEvents = 'none';

  try {
    var resp = await fetch('/api/kid/shop/buy/' + itemId, {
      method: 'POST',
      credentials: 'same-origin',
    });
    var result = await resp.json();

    if (resp.ok && result.ok) {
      currentStars = result.stars;
      updateBalance();
      celebrate();
      showToast('Куплено и надето!');
      setTimeout(reloadData, 400);
    } else {
      showToast(result.message || 'Не удалось купить');
      if (btn) btn.style.pointerEvents = '';
    }
  } catch(e) {
    showToast('Ошибка сети');
    if (btn) btn.style.pointerEvents = '';
  }
}

async function toggleEquip(itemId, equip) {
  try {
    await fetch('/api/kid/shop/equip/' + itemId, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({equipped: equip}),
    });
    showToast(equip ? 'Надето!' : 'Снято');
    reloadData();
  } catch(e) {}
}

async function reloadData() {
  try {
    var resp = await fetch('/api/kid/character', {credentials: 'same-origin'});
    if (resp.ok) {
      var data = await resp.json();
      currentStars = data.stars || 0;
      shopData = data.shop || {};
      updateBalance();
      // Update image (may have changed after equip)
      var imgSrc = data.character_image_url || '/static/kid/default-character.svg';
      document.getElementById('char-image').src = imgSrc + '?t=' + Date.now();
      renderGrid();
      // Re-render category tabs to update badge counts
      renderCategoryTabs(Object.keys(shopData));
    }
  } catch(e) {}
}

function editCharacterName() {
  document.getElementById('char-top-name').style.display = 'none';
  document.getElementById('char-name-form').style.display = 'flex';
  var inp = document.getElementById('char-name-input');
  inp.focus();
  inp.select();
}

function cancelEditName() {
  document.getElementById('char-name-form').style.display = 'none';
  document.getElementById('char-top-name').style.display = '';
}

async function saveCharacterName() {
  var input = document.getElementById('char-name-input');
  var name = (input.value || '').trim();
  if (!name) name = 'Искатель';
  try {
    var resp = await fetch('/api/kid/character/name', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name})
    });
    if (resp.ok) {
      document.getElementById('char-name-display').textContent = name;
      cancelEditName();
    }
  } catch(e) {}
}

function initSceneRail() {
  var chips = document.querySelectorAll('.char-scene-chip');
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener('click', function() {
      var scene = this.getAttribute('data-scene');
      // Toggle active chip
      for (var j = 0; j < chips.length; j++) {
        chips[j].classList.toggle('char-scene-chip--active', chips[j] === this);
      }
      // Toggle scene backgrounds
      var scenes = document.querySelectorAll('.char-scene');
      for (var k = 0; k < scenes.length; k++) {
        scenes[k].classList.toggle('char-scene--active', scenes[k].getAttribute('data-scene') === scene);
      }
    });
  }
}

function showToast(text) {
  var toast = document.getElementById('char-toast');
  document.getElementById('char-toast-text').textContent = text;
  toast.classList.add('char-toast--on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { toast.classList.remove('char-toast--on'); }, 1800);
}

function celebrate() {
  var burst = document.getElementById('char-burst');
  burst.innerHTML = '<span class="char-burst__ring"></span>';
  burst.classList.add('char-burst--on');
  // Sparkle effect
  document.getElementById('char-fx').classList.add('char-fx--on');
  setTimeout(function() {
    burst.classList.remove('char-burst--on');
    document.getElementById('char-fx').classList.remove('char-fx--on');
  }, 1200);
}

function shakeItem(itemId) {
  var el = document.querySelector('.char-item[data-id="' + itemId + '"]');
  if (!el) return;
  el.animate(
    [{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],
    {duration: 260}
  );
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
{% endblock %}
