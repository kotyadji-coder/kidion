{% extends "kid/base.html" %}

{% block title %}Kidion — Главная{% endblock %}
{% block page_name %}home{% endblock %}

{% block content %}
<div class="kid-home">
  <!-- Hero: Character + Greeting -->
  <div class="home-hero">
    <a href="/kid/character" class="home-hero__character" id="character-link">
      <div class="home-hero__avatar-placeholder" id="char-avatar">{{ child.name[0]|upper }}</div>
    </a>
    <div class="home-hero__text">
      <h1 class="home-greeting">Привет, {{ child.name }}!</h1>
      <div id="streak-wrap"></div>
      <a href="/kid/character" class="home-character-link" id="char-link-text">Мой персонаж</a>
    </div>
  </div>

  <p class="home-subtitle">Выбери, чем займёмся:</p>

  <div class="subjects-grid-kid" id="subjects-grid">
    <div class="spinner"></div>
  </div>

  <!-- Last lesson result -->
  <div id="last-result" style="display:none"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(async () => {
  // Load character + streak + stars
  try {
    var me = await fetch('/api/kid/me', {credentials: 'same-origin'}).then(r => r.json());

    // Character image
    var charAvatar = document.getElementById('char-avatar');
    if (charAvatar) {
      var img = document.createElement('img');
      img.src = me.character_image_url || '/static/kid/default-character.svg';
      img.alt = '{{ child.name }}';
      img.className = 'home-hero__character-img';
      img.onerror = function() { this.src = '/static/kid/default-character.svg'; };
      charAvatar.style.display = 'none';
      charAvatar.parentNode.insertBefore(img, charAvatar);
    }

    // Streak
    var sw = document.getElementById('streak-wrap');
    if (me.current_streak > 0 && sw) {
      sw.innerHTML = '<span class="streak-badge-mini">&#128293; ' + me.current_streak + ' ' + pluralDays(me.current_streak) + ' подряд!</span>';
    }
    var starEl = document.getElementById('star-count');
    if (starEl) starEl.textContent = me.stars || 0;
  } catch(e) {}

  // Load subjects + free lessons count in parallel
  var subjectsPromise = fetch('/api/kid/subjects', {credentials: 'same-origin'}).then(r => r.json());
  var freePromise = fetch('/api/kid/free-lessons', {credentials: 'same-origin'}).then(r => r.json());

  try {
    var results = await Promise.all([subjectsPromise, freePromise]);
    var subjectsData = results[0];
    var freeData = results[1];
    var subjects = subjectsData.subjects || [];
    var freeLessons = freeData.lessons || [];
    var grid = document.getElementById('subjects-grid');

    // Subject definitions
    var allSubjects = [
      {key: 'math', name: 'Математика', icon: '📐', color: '#6c5ce7', gradient: 'linear-gradient(135deg, #6c5ce7, #a29bfe)'},
      {key: 'russian', name: 'Русский язык', icon: '📝', color: '#00b894', gradient: 'linear-gradient(135deg, #00b894, #55efc4)'},
      {key: 'world', name: 'Окруж. мир', icon: '🌍', color: '#fdcb6e', gradient: 'linear-gradient(135deg, #f39c12, #fdcb6e)'}
    ];

    var enrolledMap = {};
    for (var i = 0; i < subjects.length; i++) {
      enrolledMap[subjects[i].subject] = subjects[i];
    }

    var html = '';
    for (var j = 0; j < allSubjects.length; j++) {
      var s = allSubjects[j];
      var enrolled = enrolledMap[s.key];
      var hasLessons = enrolled && enrolled.total_lessons > 0;
      var completed = enrolled ? enrolled.completed_lessons : 0;
      var total = enrolled ? enrolled.total_lessons : 0;
      var pct = total > 0 ? Math.round(completed / total * 100) : 0;

      if (hasLessons) {
        html += '<a href="/kid/subject/' + s.key + '" class="subject-card-kid" style="--accent:' + s.color + '; --gradient:' + s.gradient + '">';
        html += '<div class="subject-card-kid__icon-wrap" style="background:' + s.gradient + '">' + s.icon + '</div>';
        html += '<div class="subject-card-kid__body">';
        html += '<div class="subject-card-kid__name">' + s.name + '</div>';
        html += '<div class="subject-card-kid__progress-bar"><div class="subject-card-kid__progress-fill" style="width:' + pct + '%;background:' + s.gradient + '"></div></div>';
        html += '<div class="subject-card-kid__progress-text">' + completed + ' из ' + total + '</div>';
        html += '</div>';
        html += '</a>';
      } else {
        html += '<div class="subject-card-kid subject-card-kid--locked" style="--accent:' + s.color + '">';
        html += '<div class="subject-card-kid__icon-wrap subject-card-kid__icon-wrap--locked">' + s.icon + '</div>';
        html += '<div class="subject-card-kid__body">';
        html += '<div class="subject-card-kid__name">' + s.name + '</div>';
        html += '<div class="subject-card-kid__progress-text">&#128274; Закрыто</div>';
        html += '</div>';
        html += '</div>';
      }
    }

    // Free lessons card
    var freeCount = freeLessons.length;
    var freeCompleted = freeLessons.filter(function(l) { return l.stars !== null; }).length;
    var freeReady = freeLessons.filter(function(l) { return l.status === 'done' && l.stars === null; }).length;

    html += '<a href="/kid/free-lessons" class="subject-card-kid" style="--accent:#e17055; --gradient:linear-gradient(135deg, #e17055, #fab1a0)">';
    html += '<div class="subject-card-kid__icon-wrap" style="background:linear-gradient(135deg, #e17055, #fab1a0)">🎨</div>';
    html += '<div class="subject-card-kid__body">';
    html += '<div class="subject-card-kid__name">Свободные уроки</div>';
    if (freeCount > 0) {
      html += '<div class="subject-card-kid__progress-text">' + freeCount + ' ' + pluralLessons(freeCount);
      if (freeReady > 0) html += ' · ' + freeReady + ' новых';
      html += '</div>';
    } else {
      html += '<div class="subject-card-kid__progress-text">Любые темы</div>';
    }
    html += '</div>';
    html += '</a>';

    // AI Chat card
    html += '<a href="/kid/chat" class="subject-card-kid" style="--accent:#6c5ce7; --gradient:linear-gradient(135deg, #6c5ce7, #a29bfe)">';
    html += '<div class="subject-card-kid__icon-wrap" style="background:linear-gradient(135deg, #6c5ce7, #fd79a8)">&#128172;</div>';
    html += '<div class="subject-card-kid__body">';
    html += '<div class="subject-card-kid__name">Чат с помощником</div>';
    html += '<div class="subject-card-kid__progress-text">Спроси что угодно!</div>';
    html += '</div>';
    html += '</a>';

    grid.innerHTML = html;
  } catch(e) {
    document.getElementById('subjects-grid').innerHTML = '<p style="text-align:center;color:#888">Ошибка загрузки</p>';
  }
})();

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pluralDays(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'день';
  if ([2,3,4].indexOf(n % 10) !== -1 && [12,13,14].indexOf(n % 100) === -1) return 'дня';
  return 'дней';
}

function pluralLessons(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'урок';
  if ([2,3,4].indexOf(n % 10) !== -1 && [12,13,14].indexOf(n % 100) === -1) return 'урока';
  return 'уроков';
}
</script>
{% endblock %}
