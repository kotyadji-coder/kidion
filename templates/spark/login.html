<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Киди</title>
<link rel="icon" href="/static/spark/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/spark/chat.css">
<link rel="stylesheet" href="/static/spark/landing.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px; }
  .auth-h { margin: 0 0 6px; font-size: 24px; font-weight: 600; letter-spacing: -0.025em; text-align: center; }
  .auth-sub { margin: 0 0 28px; font-size: 14px; color: var(--text-2); text-align: center; }
  .auth-field { margin-bottom: 14px; }
  .auth-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  .auth-input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--surface-2); color: var(--text); outline: none; }
  .auth-input:focus { border-color: var(--spark-violet-border); box-shadow: 0 0 0 3px var(--spark-violet-soft); }
  .auth-btn { width: 100%; margin-top: 8px; }
  .auth-error { color: oklch(0.55 0.2 25); font-size: 13px; text-align: center; margin-top: 10px; display: none; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-3); }
  .auth-switch a { color: var(--spark-violet); text-decoration: none; font-weight: 500; }

  .child-picker { margin-top: 24px; display: none; flex-direction: column; gap: 10px; }
  .child-picker.is-show { display: flex; }
  .child-pick { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color .12s; }
  .child-pick:hover { border-color: var(--spark-violet-border); }
  .child-pick-av { width: 44px; height: 44px; border-radius: 50%; background: var(--spark-violet-soft); display: grid; place-items: center; font-size: 20px; flex: 0 0 44px; }
  .child-pick-name { font-size: 16px; font-weight: 600; }
  .child-pick-grade { font-size: 12px; color: var(--text-3); }

  .pin-section { margin-top: 20px; display: none; text-align: center; }
  .pin-section.is-show { display: block; }
  .pin-label { font-size: 14px; color: var(--text-2); margin-bottom: 10px; }
  .pin-input { width: 140px; height: 48px; text-align: center; font-size: 24px; letter-spacing: 8px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; background: var(--surface-2); outline: none; }
  .pin-input:focus { border-color: var(--spark-violet-border); box-shadow: 0 0 0 3px var(--spark-violet-soft); }
</style>
</head>
<body>
<div class="sp">
  <nav class="sp-nav">
    <a class="sp-brand" href="/spark">
      <span class="sp-brand-mark">K</span>
      <span>Киди</span>
    </a>
    <div class="sp-nav-cta">
      <a class="sp-btn sp-btn-primary" href="/spark/register">Регистрация</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <!-- Step 1: Login form -->
      <div id="step-login">
        <h1 class="auth-h">Войти</h1>
        <p class="auth-sub">Используйте аккаунт Kidion</p>
        <form id="login-form">
          <div class="auth-field">
            <label class="auth-label">Email</label>
            <input class="auth-input" type="email" name="email" required autocomplete="email">
          </div>
          <div class="auth-field">
            <label class="auth-label">Пароль</label>
            <input class="auth-input" type="password" name="password" required>
          </div>
          <button class="sp-btn sp-btn-primary sp-btn-lg auth-btn" type="submit">Войти</button>
        </form>
        <p class="auth-error" id="login-error"></p>
        <p class="auth-switch">Нет аккаунта? <a href="/spark/register">Зарегистрироваться</a></p>
      </div>

      <!-- Step 2: Pick child -->
      <div id="step-child" style="display:none">
        <h1 class="auth-h">Выберите ребёнка</h1>
        <div class="child-picker is-show" id="child-list"></div>
      </div>

      <!-- Step 3: Enter PIN -->
      <div id="step-pin" style="display:none">
        <h1 class="auth-h" id="pin-child-name"></h1>
        <div class="pin-section is-show">
          <p class="pin-label">Введи свой секретный код</p>
          <input class="pin-input" id="pin-input" type="text" inputmode="numeric" maxlength="4" pattern="\d{4}" autofocus>
        </div>
        <p class="auth-error" id="pin-error"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  let children = [];
  let selectedChild = null;

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    const fd = new FormData(this);

    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
    });
    if (!res.ok) {
      const d = await res.json();
      errEl.textContent = d.detail || d.error || 'Неверный email или пароль';
      errEl.style.display = '';
      return;
    }

    // Fetch children
    const childRes = await fetch('/api/children', { credentials: 'same-origin' });
    const childData = await childRes.json();
    children = childData.children || childData || [];

    if (children.length === 0) {
      // No children — redirect to registration to add one
      window.location.href = '/spark/register';
      return;
    }

    if (children.length === 1) {
      selectChild(children[0]);
    } else {
      showChildPicker();
    }
  });

  function showChildPicker() {
    document.getElementById('step-login').style.display = 'none';
    document.getElementById('step-child').style.display = '';
    const list = document.getElementById('child-list');
    list.innerHTML = '';
    children.forEach(c => {
      const div = document.createElement('div');
      div.className = 'child-pick';
      div.innerHTML = '<div class="child-pick-av">' + (c.gender === 'girl' ? '👧' : '👦') + '</div><div><div class="child-pick-name">' + c.name + '</div><div class="child-pick-grade">' + c.grade + ' класс</div></div>';
      div.addEventListener('click', () => selectChild(c));
      list.appendChild(div);
    });
  }

  function selectChild(child) {
    selectedChild = child;
    document.getElementById('step-login').style.display = 'none';
    document.getElementById('step-child').style.display = 'none';
    document.getElementById('step-pin').style.display = '';
    document.getElementById('pin-child-name').textContent = child.name;
    const pinInput = document.getElementById('pin-input');
    pinInput.value = '';
    pinInput.focus();
  }

  document.getElementById('pin-input').addEventListener('input', async function() {
    if (this.value.length === 4) {
      const errEl = document.getElementById('pin-error');
      errEl.style.display = 'none';
      const res = await fetch('/api/kid/auth', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin',
        body: JSON.stringify({ child_id: selectedChild.id, pin: this.value }),
      });
      if (res.ok) {
        window.location.href = '/spark/chat';
      } else {
        errEl.textContent = 'Неверный код';
        errEl.style.display = '';
        this.value = '';
        this.focus();
      }
    }
  });
})();
</script>
</body>
</html>
